services:
  mediaguardian:
    build: .
    image: ghcr.io/rpeters1430/mediaguardian:latest
    container_name: mediaguardian
    restart: unless-stopped
    user: "1000:10"
    init: true
    ports:
      - "127.0.0.1:8186:8080"
    env_file: .env
    environment:
      MG_DATA_DIR: /data
      MG_MEDIA_ROOT: /media
      MG_MAX_PROBES_PER_SCAN: "30"
      MG_PROBE_TIMEOUT: "12"
      MG_FILE_SLEEP: "0.02"
      MG_MAX_FILES: "250000"
    volumes:
      - /volume1/docker/mediaguardian:/data:rw
      - /volume1/Media:/media:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

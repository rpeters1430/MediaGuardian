services:
  mediaguardian:
    image: ghcr.io/rpeters1430/mediaguardian:latest
    container_name: mediaguardian
    restart: unless-stopped
    user: "1000:10"
    init: true
    ports:
      - "${MG_BIND_IP:-127.0.0.1}:8186:8080"
    env_file: .env
    environment:
      MG_DATA_DIR: /data
      MG_MEDIA_ROOT: /media
      TZ: ${TZ:-America/Los_Angeles}
      MG_MAX_PROBES_PER_SCAN: "200"
      MG_PROBE_TIMEOUT: "12"
      MG_FILE_SLEEP: "0.02"
      MG_MAX_FILES: "250000"
      # Automatic scans. Every scan walks the whole share, so frequent scans keep
      # HDDs from spinning down. MG_SCAN_WINDOW limits scheduled scans to quiet hours.
      MG_SCAN_INTERVAL_MINUTES: "360"
      MG_SCAN_WINDOW: ""
      MG_SETTLE_SECONDS: "300"
      MG_EXCLUDE: ""
      MG_SERVICE_INTERVAL: "60"
      # Download folder(s) as seen inside the container, comma-separated. Enables the
      # "stored twice" and "not in library" reports. Mount them read-only below.
      MG_DOWNLOADS: ""
      MG_UNIMPORTED_DAYS: "7"
      MG_DISK_WARN_DAYS: "30"
      MG_DISK_WARN_PERCENT: "10"
    volumes:
      - /volume1/docker/mediaguardian:/data:rw
      - /volume1/Media:/media:ro
      # - /volume1/Downloads:/downloads:ro   # then set MG_DOWNLOADS: "/downloads"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

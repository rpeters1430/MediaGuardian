services:
  mediaguardian:
    image: ghcr.io/rpeters1430/mediaguardian:latest
    container_name: mediaguardian
    restart: unless-stopped
    # Use the same user:group as Jellyfin/Plex so "can't read" findings match what they can play.
    user: "1000:10"
    init: true
    ports:
      - "${MG_BIND_IP:-127.0.0.1}:8186:8080"
    # Login and session secret live in .env (keep it chmod 600).
    env_file: .env
    environment:
      MG_DATA_DIR: /data
      MG_MEDIA_ROOT: /media
      TZ: ${TZ:-America/Los_Angeles}
      # Everything else (scans, alerts, notifications, downloads, your apps, playback)
      # is set on the dashboard under Settings. Any MG_* setting listed here is used
      # as the starting value until it is changed in Settings.
    volumes:
      - /volume1/docker/mediaguardian:/data:rw
      - /volume1/Media:/media:ro
      # To check downloads, mount the folder read-only and enter /downloads in
      # Settings → Downloads.
      # - /volume1/Downloads:/downloads:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
